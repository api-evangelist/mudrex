x-gap:
  missing: OpenAPI
  detail: >-
    Every binding above is to a documented method + path, not an operationId,
    because Mudrex publishes no OpenAPI (or Swagger, or Postman collection) for
    the Futures API. Publishing one at https://trade.mudrex.com/openapi.json —
    or exporting it from the ReadMe docs project — would make this crosswalk
    machine-verifiable and give every MCP tool a real inputSchema.
