description: >-
  Binds every tool on Mudrex's hosted MCP server to the REST operation it is
  backed by. Mudrex publishes NO OpenAPI, so there are no operationIds to bind
  to — the `rest:` column carries the documented HTTP method + path under
  https://trade.mudrex.com/fapi/v1 instead. Confidence is set from how directly
  the docs name the pair; a tool's real input contract can only be recovered
  from the prose parameter tables on the endpoint doc pages (or an authenticated
  MCP tools/list), which is the concrete cost of the missing machine-readable
  contract.
surfaces:
  openapi: null   # none published — see x-gap below
  rest:
    base_url: https://trade.mudrex.com/fapi/v1
    docs: https://docs.trade.mudrex.com/docs/quick-reference
    auth: X-Authentication header (API secret)
  websocket:
    url: wss://trade.mudrex.com/fapi/v1/price/ws/linear
    docs: https://docs.trade.mudrex.com/docs/websocket-streams
    auth: none (public)
  mcp:
    url: https://mudrex.com/mcp
    gated: true
    note: tools/list returned HTTP 401 anonymously on 2026-08-04
  graphql: null
