source: https://docs.trade.mudrex.com/docs/mcp
description: Mudrex operates an official hosted MCP server at https://mudrex.com/mcp that converts the
  Mudrex Futures Trading API into MCP tools for AI assistants. Clients connect through mcp-remote and
  authenticate with the same X-Authentication API secret used by the REST API (the header is passed on
  the connection, not an OAuth flow). The tool list below is captured verbatim from the provider's MCP
  documentation page, including the provider's own "Confirmation required" marking on state-changing tools.
  A live `tools/list` JSON-RPC POST to https://mudrex.com/mcp returned HTTP 401 {"errors":[{"code":3100,"text":"Invalid
  Authentication"}]} on 2026-08-04, so the machine-readable inputSchema for each tool requires an authenticated
  introspection and is not captured here.
server:
  name: mudrex
  transport: http
  url: https://mudrex.com/mcp
  auth: api-key
  auth_header: X-Authentication
  client_config: "{\n  \"mcpServers\": {\n    \"mcp-futures-trading\": {\n      \"command\": \"npx\",\n\
    \      \"args\": [\"-y\", \"mcp-remote\", \"https://mudrex.com/mcp\", \"--header\", \"X-Authentication:${API_SECRET}\"\
    ],\n      \"env\": { \"API_SECRET\": \"<your-api-secret>\" }\n    }\n  }\n}\n"
