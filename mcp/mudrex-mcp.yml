prerequisites:
- Complete KYC (PAN & Aadhaar) verification on the Mudrex account.
- Enable TOTP two-factor authentication.
- Generate an API key at https://mudrex.com/pro-trading and store the secret (shown once).
- Funds must be moved from the SPOT to the FUTURES wallet via the app or web platform before trading.
