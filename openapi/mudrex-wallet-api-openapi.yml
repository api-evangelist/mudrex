openapi: 3.2.0
info:
  title: Trading Wallet API
  version: 1.0.0
  x-source-url: https://dash.readme.com/api/v1/api-registry/1l63p11jmi48ir8h
  x-documentation-url: https://docs.trade.mudrex.com/docs/overview
  x-last-validated: '2026-08-10'
  x-provenance: first-party — retrieved from the provider's own documentation host
servers:
- url: http://{{tradeurl}}
tags:
- name: Wallet
paths:
  /fapi/v1/wallet/funds:
    get:
      tags:
      - Wallet
      summary: Get (SPOT) Funds
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
  /fapi/v1/wallet/futures/transfer:
    post:
      tags:
      - Wallet
      summary: Transfer Funds
      requestBody:
        content:
          application/json:
            schema:
              type: object
              example:
                from_wallet_type: SPOT
                to_wallet_type: FUTURES
                amount: 10.5
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
