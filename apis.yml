aid: mudrex
name: Mudrex
description: 'Mudrex is a US-headquartered, Bengaluru-based crypto investment and
  trading platform founded in 2018 and registered with India''s Financial Intelligence
  Unit (FIU-IND). It serves retail and pro traders with spot trading, curated Coin
  Sets, and USDT- and INR-margined perpetual futures. Its developer surface is the
  Mudrex Futures API — a REST trading API under https://trade.mudrex.com/fapi/v1
  covering wallet transfers, asset discovery, leverage and margin type, order
  create/amend/cancel, position management with stop-loss/take-profit, liquidation
  pricing and fee history — plus a public, unauthenticated market-data surface
  (historical price and mark-price klines over REST, live kline/mark-kline/ticker
  streams over WebSocket) and an officially hosted MCP server at
  https://mudrex.com/mcp that exposes 20 trading tools to AI agents. Authentication
  is a single X-Authentication API-key header issued after KYC and TOTP two-factor
  enrollment. An official Python SDK ships on PyPI as mudrex-sdk.'
