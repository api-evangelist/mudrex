apis:
- aid: mudrex:mudrex-futures-trading-api
  name: Mudrex Futures Trading API
  humanURL: https://docs.trade.mudrex.com/docs/overview
  baseURL: https://trade.mudrex.com/fapi/v1
  tags:
  - Futures
  - Trading
  - Orders
  - Positions
  - Leverage
  - Wallet
  - Fees
  description: >-
    Programmatic control over a Mudrex futures trading account. Transfer funds between the spot and futures
    wallets (USDT and INR), list tradeable instruments and contract specifications, get and set leverage
    and margin type per (asset, currency), place market and limit LONG/SHORT orders with optional attached
    stop-loss and take-profit, amend and cancel orders, query open orders and order history, manage open
    positions (add/reduce margin, estimate liquidation price, set and edit SL/TP, partial close, reverse,
    square off), and retrieve trading and funding fee history. Authenticated with an X-Authentication
    API-key header; responses are a JSON envelope with numeric values as strings to preserve precision.
  properties:
  - url: https://docs.trade.mudrex.com/docs/overview
    type: Documentation
  - url: https://docs.trade.mudrex.com/docs/quick-reference
    type: APIReference
  - url: https://docs.trade.mudrex.com/docs/quickstart
    type: GettingStarted
  - url: https://docs.trade.mudrex.com/docs/api-terms-conditions
    type: TermsOfService
- aid: mudrex:mudrex-market-data-api
  name: Mudrex Market Data API
  humanURL: https://docs.trade.mudrex.com/docs/market-data
  baseURL: https://trade.mudrex.com/fapi/v1/price
  tags:
  - Market Data
  - Klines
  - WebSocket
  - Streaming
  description: >-
    Public, unauthenticated market-data surface for Mudrex linear perpetual futures. Over REST it returns
    bulk historical OHLCV price klines (GET /price/kline, up to 25 assets and 1440 candles per asset)
    and OHLC mark-price klines (GET /price/mark-kline). Over WebSocket (wss://trade.mudrex.com/fapi/v1/price/ws/linear)
    it streams 1-second and 1-minute klines and mark-klines plus 1-second and 5-second tickers, using
    a SUBSCRIBE / UNSUBSCRIBE / LIST_SUBSCRIPTIONS envelope. Rate-limited per IP at 300 REST requests
    per minute, 15 active subscriptions per connection and 10 new connections per minute.
  properties:
  - url: https://docs.trade.mudrex.com/docs/market-data
    type: Documentation
  - url: https://docs.trade.mudrex.com/docs/websocket-streams
    type: WebSocket
  - url: asyncapi/mudrex-market-data-streams.yml
    type: EventCatalog
- aid: mudrex:mudrex-mcp-server
  name: Mudrex MCP Server
  humanURL: https://docs.trade.mudrex.com/docs/mcp
  baseURL: https://mudrex.com/mcp
  tags:
  - MCP
  - Agents
  - Trading
  description: >-
    Mudrex's official hosted Model Context Protocol server, which exposes the Mudrex Futures Trading API
    to MCP-capable AI assistants as 20 tools across orders, positions, risk management (stop-loss/take-profit),
    leverage and margin, and market/account info. Connected over mcp-remote with the same X-Authentication
    API secret used by the REST API; state-changing tools are marked as requiring user confirmation in
    the provider's documentation.
  properties:
  - url: https://docs.trade.mudrex.com/docs/mcp
    type: Documentation
  - url: mcp/mudrex-mcp.yml
    type: MCPServer
  - url: mcp/mudrex-tool-crosswalk.yml
    type: ToolCrosswalk
